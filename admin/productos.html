<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos — Panel DistriElectro</title>
<link rel="stylesheet" href="admin-style.css">
</head>
<body>
<div id="app-content" hidden>
  <h1 class="page-title">Productos cargados</h1>
  <p class="page-sub" id="totalSub">Cargando...</p>

  <div id="msgBox"></div>

  <div class="card">
    <form id="filtroForm" style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end">
      <div style="flex:1; min-width:200px"><label>Buscar</label><input type="text" id="q" placeholder="SKU, descripción, marca..." style="margin-bottom:0"></div>
      <div style="min-width:200px">
        <label>Proveedor</label>
        <select id="proveedorFiltro" style="margin-bottom:0"><option value="">Todos</option></select>
      </div>
      <button class="btn" type="submit" style="height:38px">Buscar</button>
    </form>
  </div>

  <div class="card">
    <div style="overflow-x:auto">
    <table>
      <thead><tr><th>SKU</th><th>EAN</th><th>Proveedor</th><th>Marca</th><th>Descripción</th><th>Precio lista</th><th>Caja</th><th>Stock</th><th>Actualizado</th><th></th></tr></thead>
      <tbody id="rowsBody"><tr><td colspan="10" style="text-align:center; color:#98a2b3; padding:24px">Cargando...</td></tr></tbody>
    </table>
    </div>
    <div id="pager" style="display:flex; justify-content:center; gap:8px; margin-top:16px; flex-wrap:wrap"></div>
  </div>

  <div class="card">
    <strong style="font-size:13px; color:#dc2626">Zona de riesgo</strong>
    <p class="hint">Vaciar todos los productos de un proveedor — útil antes de re-importar una lista completa desde cero.</p>
    <form id="vaciarForm" style="display:flex; gap:10px; align-items:flex-end; max-width:420px">
      <div style="flex:1">
        <label>Proveedor</label>
        <select id="proveedorVaciar" required style="margin-bottom:0"><option value="">Elegir...</option></select>
      </div>
      <button class="btn btn-danger" type="submit" style="height:38px">Vaciar</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-config.js"></script>
<script src="admin-common.js"></script>
<script>
const PER_PAGE = 50;
let page = 1;
let proveedores = [];

function mostrarMsg(texto, tipo) {
  document.getElementById('msgBox').innerHTML = `<div class="${tipo === 'ok' ? 'msg-ok' : 'msg-error'}">${h(texto)}</div>`;
}

async function cargarProveedoresFiltro() {
  const { data } = await sb.from('proveedores').select('id, nombre').order('nombre');
  proveedores = data || [];
  const opts = proveedores.map(p => `<option value="${p.id}">${h(p.nombre)}</option>`).join('');
  document.getElementById('proveedorFiltro').insertAdjacentHTML('beforeend', opts);
  document.getElementById('proveedorVaciar').insertAdjacentHTML('beforeend', opts);
}

async function cargarProductos() {
  const q = document.getElementById('q').value.trim();
  const proveedorId = document.getElementById('proveedorFiltro').value;
  const body = document.getElementById('rowsBody');
  body.innerHTML = '<tr><td colspan="10" style="text-align:center; color:#98a2b3; padding:24px">Cargando...</td></tr>';

  let query = sb.from('productos').select('id, sku, ean, marca, descripcion, precio_lista, caja_master, stock_estado, updated_at, proveedores(nombre)', { count: 'exact' });
  if (q) query = query.or(`sku.ilike.%${q}%,descripcion.ilike.%${q}%,marca.ilike.%${q}%`);
  if (proveedorId) query = query.eq('proveedor_id', proveedorId);

  const from = (page - 1) * PER_PAGE;
  const to = from + PER_PAGE - 1;
  query = query.order('updated_at', { ascending: false }).range(from, to);

  const { data: rows, count, error } = await query;
  if (error) { mostrarMsg('Error al buscar: ' + error.message, 'error'); return; }

  document.getElementById('totalSub').textContent = `${count ?? 0} productos en total.`;

  if (!rows || rows.length === 0) {
    body.innerHTML = '<tr><td colspan="10" style="text-align:center; color:#98a2b3; padding:24px">No hay productos que coincidan.</td></tr>';
  } else {
    body.innerHTML = rows.map(r => `
      <tr>
        <td>${h(r.sku)}</td>
        <td style="color:#667">${h(r.ean || '—')}</td>
        <td style="color:#667">${h(r.proveedores?.nombre || '')}</td>
        <td><span class="tag">${h(r.marca)}</span></td>
        <td>${h((r.descripcion || '').slice(0, 70))}</td>
        <td>${money(r.precio_lista)}</td>
        <td>${r.caja_master || '—'}</td>
        <td>${h(r.stock_estado)}</td>
        <td style="color:#98a2b3; font-size:11.5px">${fechaCorta(r.updated_at)}</td>
        <td><button class="btn btn-sm btn-danger" data-del="${r.id}">Eliminar</button></td>
      </tr>
    `).join('');
    body.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', eliminarProducto));
  }

  const totalPages = Math.max(1, Math.ceil((count || 0) / PER_PAGE));
  page = Math.min(page, totalPages);
  const pager = document.getElementById('pager');
  if (totalPages > 1) {
    let html = '';
    for (let p = 1; p <= totalPages; p++) {
      html += `<button class="btn btn-sm ${p === page ? '' : 'btn-secondary'}" data-page="${p}">${p}</button>`;
    }
    pager.innerHTML = html;
    pager.querySelectorAll('[data-page]').forEach(btn => btn.addEventListener('click', () => { page = Number(btn.dataset.page); cargarProductos(); }));
  } else {
    pager.innerHTML = '';
  }
}

async function eliminarProducto(e) {
  const id = Number(e.target.dataset.del);
  if (!confirm('¿Eliminar este producto?')) return;
  const { error } = await sb.from('productos').delete().eq('id', id);
  if (error) { mostrarMsg('No se pudo eliminar: ' + error.message, 'error'); return; }
  mostrarMsg('Producto eliminado.', 'ok');
  await cargarProductos();
}

document.getElementById('filtroForm').addEventListener('submit', (e) => { e.preventDefault(); page = 1; cargarProductos(); });

document.getElementById('vaciarForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pid = document.getElementById('proveedorVaciar').value;
  if (!pid) return;
  if (!confirm('¿Seguro? Esto borra TODOS los productos de ese proveedor.')) return;
  const { error, count } = await sb.from('productos').delete({ count: 'exact' }).eq('proveedor_id', pid);
  if (error) { mostrarMsg('No se pudo vaciar: ' + error.message, 'error'); return; }
  mostrarMsg(`Se eliminaron ${count ?? 0} productos de ese proveedor.`, 'ok');
  page = 1;
  await cargarProductos();
});

(async () => {
  const session = await requireAdmin();
  if (!session) return;
  renderChrome('productos.html', session.user.email);
  await cargarProveedoresFiltro();
  await cargarProductos();
})();
</script>
</body>
</html>
